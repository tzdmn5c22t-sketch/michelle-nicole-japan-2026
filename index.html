IRE OSAKA","url":"https://www.hankyu-hotel.com/en/hotel/respire/granosaka/access","photo":"hotel"},{"time":"11:10","name":"交通｜前往新梅田食道街","place":"大阪飯店 → Sakura 大阪燒","category":"交通","desc":"離開飯店後往 JR 大阪站／阪急大阪梅田站方向走至「新梅田食道街」。從飯店預估步行約 10–15 分鐘，路口多，跟 Google 步行導航；行李已寄存，不用拖行李。","meta":"預估步行 10–15 分","map":"お好み焼 Sakura 新梅田食道街","url":"https://okonomiyakisakura.net/","photo":null},{"time":"11:30","name":"午餐｜大阪燒","place":"お好み焼 Sakura（新梅田食道街）","category":"午餐","desc":"指定的老店，1964 年創業，JR 大阪站高架橋下，官方 11:00–22:00。現場可能需候位，預留至 13:00。可點大阪燒及炒麵分享，不必再排 Yukari。","meta":"約 ¥1,000–2,000｜11:00–22:00","map":"お好み焼 Sakura 新梅田食道街","url":"https://okonomiyakisakura.net/","photo":null},{"time":"13:10","name":"參拜｜市區神社","place":"露天神社（お初天神）","category":"景點","desc":"吃完午餐往東梅田／曾根崎方向移動。由新梅田食道街步行估計約 10–15 分鐘，若疲倦先在商場休息。神社以戀愛祈願及心形繪馬聞名，停留約 30–45 分鐘；御守授與時間以現場公告為準。","meta":"免費參拜｜御守另計","map":"Tsuyutenjin Ohatsu Tenjin Shrine","url":"https://www.tuyutenjin.com/","photo":null},{"time":"14:10","name":"百貨｜大衣、鞋子","place":"阪急梅田本店","category":"購物","desc":"從露天神社返回阪急百貨周邊，估計步行 10–15 分鐘。先看氣質大衣、洋裝、女鞋，買完可到樓層座位休息。","meta":"購物樓層一般 10:00–20:00","map":"Hankyu Umeda Main Store","url":"https://www.hankyu-dept.co.jp/honten/","photo":null},{"time":"15:30","name":"甜點｜水果千層","place":"HARBS 大丸梅田店","category":"甜點","desc":"這間是你在 Threads 看到的 HARBS 水果千層；從阪急百貨往 JR 大阪站大丸梅田店移動，步行預估約 10–15 分。預留 45–60 分鐘坐著休息，若排隊過長改當天其他咖啡廳。","meta":"約 ¥1,000–1,800","map":"HARBS 大丸梅田店","url":"https://www.harbs.co.jp/","photo":"harbs"},{"time":"16:40","name":"購物｜日系女裝女鞋","place":"LUCUA Osaka／LUCUA 1100","category":"購物","desc":"從大丸梅田店依 JR 大阪站指標前往 LUCUA。優先逛大衣、鞋子、洋裝，不用把整棟逛完；購物樓層通常 10:30–20:30。","meta":"購物另計｜10:30–20:30","map":"LUCUA Osaka","url":"https://www.lucua.jp/","photo":null},{"time":"18:30","name":"晚餐｜梅田","place":"LUCUA 餐飲樓層","category":"晚餐","desc":"今天已吃大阪燒，晚餐選壽司、烏龍麵或日式定食，找有座位且免長時間排隊的店。","meta":"約 ¥1,200–2,000","map":"LUCUA Osaka","url":"","photo":null},{"time":"20:00","name":"回飯店休息","place":"Hotel Hankyu GRAN RESPIRE OSAKA","category":"休息","desc":"依大阪站梅北側指標走回飯店， jp/shinsaibashi/hours.html","photo":null},{"time":"16:00","name":"交通｜前往道頓堀","place":"心齋橋 → 道頓堀／難波","category":"交通","desc":"如果累了就回心齋橋站搭御堂筋線往「なかもず」方向 1 站到「難波 Namba M20」，出站走到道頓堀固力果橋周邊約 5–10 分鐘；若選步行，請中途休息，不連續走超過 15 分鐘。","meta":"地鐵 1 站或分段短走","map":"Dotonbori Glico Sign","url":"","photo":null},{"time":"16:35","name":"景點｜固力果招牌","place":"道頓堀戎橋／固力果招牌","category":"景點","desc":"在戎橋拍照、看看河岸夜景，逛 30 分鐘就好；此處人潮密集，注意隨身行李。","meta":"免費拍照","map":"Dotonbori Glico Sign","url":"","photo":null},{"time":"17:10","name":"小吃｜大阪章魚燒","place":"道頓堀 たこ焼道楽 わなか（候選）","category":"小吃","desc":"章魚燒當下午點心，附近人潮太多就挑其他現做章魚燒店，不為排隊犧牲晚餐時間。這是候選，不是已訂餐廳。","meta":"約 ¥600–1,000","map":"Takoyaki Wanaka Dotonbori","url":"","photo":null},{"time":"17:50","name":"晚餐｜道頓堀自由選","place":"心齋橋／道頓堀自由選晚餐","category":"晚餐","desc":"自由在心齋橋、道頓堀選擇喜歡的餐廳，當天再看排隊狀況；不指定烏龍麵店。章魚燒可另外當小吃。","meta":"自由選擇｜預抓 ¥1,200–2,500／人","map":"Dotonbori Osaka restaurants","url":"","photo":null},{"time":"19:00","name":"交通｜返回飯店","place":"難波 M20 → 梅田 M16 → 飯店","category":"交通","desc":"從道頓堀步行到 Osaka Metro「難波站 M20」（約 5–10 分鐘），搭御堂筋線往「新大阪／江坂」方向，經心齋橋、本町、淀屋橋至梅田 M16，下車後依北口指標回飯店（官方梅田站步行約 8 分鐘）。","meta":"車程約 9–11 分，含步行預留 30–40 分","map":"Osaka Metro Namba Station M20","url":"https://subway.osakametro.co.jp/","photo":null},{"time":"19:45","name":"整理行李與伴手禮","place":"大阪飯店","category":"休息","desc":"明天早班機，今晚整理伴手禮、液體與托運物品，確認 HARUKA 車票、月台及出發時間。","meta":"不再安排夜間購物","map":"Hotel Hankyu GRAN RESPIRE OSAKA","url":"","photo":null}]},{"date":"11/20","dow":"五","location":"回程","title":"平安返家","subtitle":"不排景點，留足時間到關西機場","stay":"—","items":[{"time":"06:45","name":"早餐","place":"飯店附近／前晚準備","category":"早餐","desc":"前一晚買好飯糰、麵包或三明治。","meta":"¥400–700","map":"Hotel Hankyu GRAN RESPIRE OSAKA","url":"","photo":null},{"time":"07:10","name":"退房","place":"大阪飯店 → JR 大阪站","category":"住宿","desc":"先從大阪飯店退房，依官方指引從 GRAND GREEN OSAKA 南館步行約 4 分鐘至 JR 大阪站「うめきた地下口／梅北地下出口」，再找 HARUKA 月台；預留進站、電梯及行李時間。","meta":"步行約 4–10 分","map":"Osaka Station Umekita Underground","url":"","photo":null},{"time":"07:20","name":"HARUKA","pla function setExchangeRate(){
 const inp=$('#exchangeRate');if(!inp)return;
 const value=Number(inp.value);
 if(!Number.isFinite(value)||value<=0||value>10){toast('請輸入有效匯率，例如 0.21');return}
 state.rate=value;save();
 updateConversion('yen');
 const total=state.expenses.reduce((a,e)=>a+e.amount,0),label=$('#budgetTwdTotal');
 if(label)label.textContent='NT$'+money(total*state.rate);
 const note=$('#rateNote');if(note)note.textContent='以您設定的 ¥1 ≈ NT$'+state.rate.toFixed(4)+' 換算，非即時銀行牌告匯率。';
}
function updateConversion(from){
 const yen=$('#convertYen'),twd=$('#convertTwd');if(!yen||!twd)return;
 const r=Number(state.rate)||0.21;
 if(from==='twd'){yen.value=twd.value===''?'':String(Math.round((Number(twd.value)||0)/r*100)/100)}
 else {twd.value=yen.value===''?'':String(Math.round((Number(yen.value)||0)*r*100)/100)}
}
function budgetView(){let total=state.expenses.reduce((a,e)=>a+e.amount,0);let nt=Math.round(total*state.rate),categories=['餐飲','交通','景點門票','購物','住宿','伴手禮','其他'];let sumBy=c=>state.expenses.filter(e=>e.cat===c).reduce((a,e)=>a+e.amount,0);return `<div class="head"><span class="day">EXPENSES</span><h2>旅行記帳</h2><p>新增花費、自動加總；也可以使用日幣／台幣雙向換算。</p></div><div class="panel exchange-panel"><h3>💱 日幣／台幣換匯計算器</h3><label class="field">設定匯率：1 日圓＝幾元台幣？<input id="exchangeRate" type="number" inputmode="decimal" step="0.0001" min="0.0001" value="${state.rate}" onchange="setExchangeRate()" aria-label="每一日圓可換多少台幣"></label><div class="exchange-grid"><label class="field">🇯🇵 日幣 JPY<input id="convertYen" type="number" inputmode="decimal" min="0" value="1000" oninput="updateConversion('yen')" aria-label="日幣金額"></label><div class="exchange-symbol">⇄</div><label class="field">🇹🇼 台幣 TWD<input id="convertTwd" type="number" inputmode="decimal" min="0" value="${Math.round(1000*state.rate*100)/100}" oninput="updateConversion('twd')" aria-label="台幣金額"></label></div><p class="muted" id="rateNote">以您設定的 ¥1 ≈ NT$${Number(state.rate).toFixed(4)} 換算，非即時銀行牌告匯率。</p></div><div class="panel"><h3>新增花費</h3><div class="split"><label class="field">日期<select id="expdate">${DATA.days.map(d=>`<option>${d.date}</option>`).join('')}</select></label><label class="field">分類<select id="expcat">${categories.map(c=>`<option>${c}</option>`).join('')}</select></label></div><label class="field">品項名稱<input id="expname" placeholder="例如：HARBS 蛋糕"></label><label class="field">日幣金額 ¥<input type="number" id="expamt" inputmode="decimal" min="0" placeholder="例如 1200"></label><div class="split"><label class="field">付款人<select id="exppayer"><option>Nicole</option><option>Michelle</option></select></label><label class="field">由誰分攤<select id="expshare"><option value="both">兩人平均</option><option value="Nicole">Nicole</option><option value="Michelle">Michelle</option></select></label></div><button class="btn" style="width:100%;margin-top:9px" onclick="addExp()">＋ 加入這筆花費</button></div><div class="panel"><h3>目前消費</h3><div class="summarygrid"><div class="stat"><small>日幣合計</small><strong>¥${money(total)}</strong></div><div class="stat"><small>台幣參考值</small><strong id="budgetTwdTotal">NT$${money(nt)}</strong></div></div><p class="muted">依上方自行設定的匯率換算，刷卡實際匯率及手續費可能不同。</p>${categories.map(c=>`<div class="listrow"><span>${c}</span><b>¥${money(sumBy(c))}</b></div>`).join('')}</div>${settlement()}<div class="panel"><h3>花費紀錄</h3>${state.expenses.length?state.expenses.map((e,i)=>`<div class="listrow"><div><b>${esc(e.name)}</b><br><small>${e.date} · ${e.cat} · ${e.payer} 付款</small></div><div><b>¥${money(e.amount)}</b><br><button onclick="delExp(${i})">刪除</button></div></div>`).join(''):'<p class="muted">目前還沒有新增花費。</p>'}<p class="muted">資料只保存在這支手機的 Safari 瀏覽器。兩人手機不會自動同步；清除瀏覽資料可能會遺失紀錄。</p></div>`}
function settlement(){let paid={Nicole:0,Michelle:0},owed={Nicole:0,Michelle:0};state.expenses.forEach(e=>{paid[e.payer]+=e.amount;if(e.share==='both'){owed.Nicole+=e.amount/2;owed.Michelle+=e.amount/2}else owed[e.share]+=e.amount});let diff=paid.Nicole-owed.Nicole,txt=Math.abs(diff)<.01?'目前兩人剛好平衡':diff>0?`Michelle 應轉給 Nicole ¥${money(diff)}`:`Nicole 應轉給 Michelle ¥${money(-diff)}`;return panel('雙人分帳',`<div class="listrow"><span>Nicole 先付</span><b>¥${money(paid.Nicole)}</b></div><div class="listrow"><span>Michelle 先付</span><b>¥${money(paid.Michelle)}</b></div><p style="font-weight:900;font-size:19px">${txt}</p><p class="muted">計算依各筆「由誰分攤」設定；僅作旅行記帳參考。</p>`)}function addExp(){if(!canEditTrip()){toast('沒有共同記帳權限');return}let amount=Number($('#expamt').value),name=$('#expname').value.trim();if(!name||!Number.isFinite(amount)||amount<=0){toast('請填寫品項名稱與正確金額');return}state.expenses.push({date:$('#expdate').value,cat:$('#expcat').value,name,amount,payer:$('#exppayer').value,share:$('#expshare').value});save();cloudPushExpenses('新增',name);render()}function delExp(i){if(!canEditTrip()){toast('沒有共同記帳權限');return}let name=state.expenses[i]?.name||'';state.expenses.splice(i,1);save();cloudPushExpenses('刪除',name);render()}
function foodView(){let types=['早餐','午餐','晚餐','甜點','小吃'];return `<div class="head"><span class="day">FOOD GUIDE</span><h2>美食分類</h2><p>從五天行程自動讀取；新增或刪除餐廳時，這裡會跟著同步。</p></div>`+types.map(c=>panel(categoryIcons[c]+' '+c,days().flatMap((d,di)=>d.items.filter(x=>x.category===c).map(x=>`<div class="listrow food-row"><div class="food-detail"><b>${esc(x.place)}</b><small>第 ${di+1} 天 ${d.date} · ${x.time} · ${esc(x.meta||x.name)}</small></div><div class="linkrow food-buttons">${x.map?`<a class="action" target="_blank" rel="noopener" href="${maps(x.map)}">地圖</a>`:''}<button class="btn secondary" onclick="go('day${di}')">看行程</button></div></div>`)).join('')||'<p class="muted">這一類還沒有行程，可以在每天的行程新增。</p>')).join('')}

function shareDay(n){
 const d=days()[n];
 const lines=['✿ 神戶・大阪旅行｜第'+(n+1)+'天 '+d.date+'（'+d.dow+'）', '📍 '+d.location,''];
 d.items.forEach(x=>lines.push(x.time+'｜'+x.place+'（'+x.category+'）'+(x.meta?' · '+x.meta:'')));
 lines.push('','※ 這是傳送當下的行程快照，之後各自在手機修改不會自動同步。','查看原始網站：https://tzdmn5c22t-sketch.github.io/michelle-nicole-japan-2026/');
 const txt=lines.join('\n');
 if(navigator.share){navigator.share({title:'神戶・大阪｜'+d.date+' 行程',text:txt}).catch(err=>{if(err.name!=='AbortError')copyTripText(txt)});return}
 copyTripText(txt);
}
function copyTripText(text){
 if(navigator.clipboard?.writeText){navigator.clipboard.writeText(text).then(()=>toast('已複製行程，可貼到 LINE')).catch(()=>fallbackCopy(text));return}
 fallbackCopy(text);
}
function fallbackCopy(text){
 const area=document.createElement('textarea');area.value=text;area.style.position='fixed';area.style.opacity='0';document.body.appendChild(area);area.select();
 try{document.execCommand('copy');toast('已複製行程，可貼到 LINE')}catch(e){prompt('請長按複製以下行程，貼到 LINE',text)}finally{area.remove()}
}
function shareView(){return `<div class="head"><span class="day">SHARE YOUR DAY</span><h2>📨 分享行程給姊姊</h2><p>不用登入 Gmail，也不需要匯入匯出。改完行程後選擇日期，透過 iPhone 分享選單傳到 LINE。</p></div><div class="panel"><h3>選一天分享</h3><div class="share-grid">${days().map((d,n)=>`<button class="btn" onclick="shareDay(${n})">${d.date} ${d.location}　↗</button>`).join('')}</div><p class="muted">分享的是文字快照，不會即時同步另一支手機；內容不會包含你的私人記帳明細。</p></div>${toolsView()}`}
const WEATHER_CITIES=[{name:'神戶',lat:34.69,lon:135.195},{name:'大阪',lat:34.702,lon:135.496}];let weatherCache=null,weatherUpdated=0;
function wxLabel(code){if(code===0)return '晴朗';if([1,2,3].includes(code))return '多雲';if([45,48].includes(code))return '有霧';if([51,53,55,56,57].includes(code))return '毛毛雨';if([61,63,65,66,67,80,81,82].includes(code))return '有雨';if([71,73,75,77,85,86].includes(code))return '可能下雪';if([95,96,99].includes(code))return '雷雨';return '天氣變化'}
function weatherView(){let cards=WEATHER_CITIES.map((c,i)=>{let w=weatherCache?.[i];let val=w?.current;let daily=w?.daily;return `<div class="wx-card"><b>${c.name}</b><div class="temp">${val?Math.round(val.temperature_2m)+'°C':'— °C'}</div><small>${val?wxLabel(val.weather_code):'資料讀取中或暫無資料'}</small><small>體感：${val?Math.round(val.apparent_temperature)+'°C':'—'}</small><small>今日最高／最低：${daily?Math.round(daily.temperature_2m_max[0])+'° / '+Math.round(daily.temperature_2m_min[0])+'°':'—'}</small><small>今日最大降雨機率：${daily?daily.precipitation_probability_max[0]+'%':'—'}</small></div>`}).join('');return `<div class="head"><span class="day">WEATHER & NOTICE</span><h2>🌤️ 天氣與旅途公告</h2><p>神戶、大阪目前氣溫、降雨與官方旅遊交通資訊。</p></div><div class="panel"><h3>現在的天氣</h3><div class="wx-grid">${cards}</div><p class="muted">天氣由 Open-Meteo 線上取得，依日本當地時間顯示。${weatherUpdated?'最近更新：'+new Date(weatherUpdated).toLocaleString('zh-TW',{timeZone:'Asia/Tokyo'}):'尚未更新'}。部分天氣預報會變動。</p><div class="cloud-row"><button class="btn secondary" onclick="loadWeather(true)">↻ 重新取得天氣</button></div><p class="muted">出門穿搭建議：若體感低於 12°C，準備外套；降雨機率偏高可帶摺疊傘。11/17 布引纜車遇強風可能停駛，出發前務必查看官方公告。</p></div><div class="panel"><h3>🎄 期間限定活動（請再確認日期）</h3><p>🌲 神戶布引香草園：聖誕季主題與市集，適合 11/17 參觀時順道看看。</p><p>🎁 阪急梅田本店：聖誕季特展與市集，適合 11/18 梅田購物時留意。</p><p>✨ 梅田 Grand Front / Grand Green：冬季燈飾，無須特地跨區。</p><p class="muted">這裡是活動提醒，不代表即時確認仍在舉辦；以以下官方公布為準。</p><div class="linkrow"><a class="action" target="_blank" rel="noopener" href="https://www.kobeherb.com/">布引香草園官網</a><a class="action" target="_blank" rel="noopener" href="https://www.hankyu-dept.co.jp/honten/">阪急百貨官網</a><a class="action" target="_blank" rel="noopener" href="https://www.grandfront-osaka.jp/">Grand Front</a></div></div><div class="panel"><h3>🚨 日本旅途安全與交通</h3><p>下方是即時官方資訊連結，並非本站已自動驗證過的最新新聞。旅途中若遇地震、颱風、列車延誤，優先點官方網站確認。</p><div class="linkrow"><a class="action" target="_blank" rel="noopener" href="https://www.jma.go.jp/bosai/">日本氣象廳</a><a class="action" target="_blank" rel="noopener" href="https://www.westjr.co.jp/global/en/">JR 西日本</a><a class="action" target="_blank" rel="noopener" href="https://www.japan.travel/en/plan/hotline/">JNTO 旅客支援</a></div></div>`}
async function loadWeather(force=false){if(!force&&Date.now()-weatherUpdated<35*60*1000)return;try{const results=await Promise.all(WEATHER_CITIES.map(async c=>{const u='https://api.open-meteo.com/v1/forecast?latitude='+c.lat+'&longitude='+c.lon+'&current=temperature_2m,apparent_temperature,weather_code&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=Asia%2FTokyo&forecast_days=7';const res=await fetch(u);if(!res.ok)throw Error('weather HTTP '+res.status);return await res.json()}));weatherCache=results;weatherUpdated=Date.now()}catch(e){weatherCache=null}if(state.tab==='weather'||/^day[0-4]$/.test(state.tab))render()}
function render(){nav();const t=state.tab;let h=t==='flights'?flights():t.startsWith('day')?dayView(Number(t.slice(3))):t==='map'?mapView():t==='packing'?packingView():t==='budget'?budgetView():t==='share'?shareView():t==='weather'?weatherView():foodView();$('#app').innerHTML=h;if(t==='weather'||t.startsWith('day'))loadWeather();}render();</script><script>
(function(){let el=document.getElementById('countdown');if(!el)return;let target=new Date('2026-11-16T07:05:00+08:00').getTime(),delta=target-Date.now();el.textContent=delta>0?Math.ceil(delta/86400000)+' 天': '旅途中 ✦';})();
