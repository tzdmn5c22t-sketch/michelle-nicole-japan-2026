</style></head><body><header><small>KOBE · OSAKA / 16–20 NOV 2026</small><h1>神戶・大阪<br>五天四夜</h1><p>和姊姊一起玩｜美食・甜點・神社・秋天風景・女裝購物</p><div class="hero"><img id="heroImage" alt="神戶秋天纜車景色"><span>真正能帶著走的手機版行程</span></div></header><nav class="topnav" id="topnav" aria-label="切換日期"></nav><main class="content"><section id="dayview" class="view active"></section><section id="foodview" class="view"></section><section id="budgetview" class="view"></section><section id="transportview" class="view"></section></main><div class="stickybottom"><button id="prev" class="secondary">← 前一天</button><button id="next">下一天 →</button></div><script>const D={"days": [{"date": "11/16（一）", "name": "DAY 01", "title": "抵達神戶 · 先吃飯，後玩水族館", "sub": "今天已經很早起床，重點是吃飽、安頓、不要趕。", "photo": "aquarium", "summary": "機場 → 搭船 → 三宮 → 正餐 → 飯店休息 → 可選水族館 → 燒肉或牛排", "cost": "¥6,800–11,000", "items": [{"time": "05:30–07:05", "title": "高雄機場：先吃早餐", "desc": "長途交通日前先吃早餐或準備可攜帶輕食。", "tag": "早餐", "duration": "30–45 分", "price": "台灣自行安排", "walk": "", "map": "", "site": "", "review": "", "pic": "", "extra": "", "optional": false}, {"time": "10:55–12:15", "title": "關西機場：入境、領行李、補水", "desc": "不要假設 11:00 一定能出關。若 12:00 前已完成出關，再看是否趕 13:15 船班。", "tag": "機場", "duration": "70–90 分", "price": "", "walk": "站內移動", "map": "Kansai International Airport Terminal 1", "site": "https://www.kobe-access.jp/eng/howto.php", "review": "", "pic": "", "extra": "", "optional": false}, {"time": "12:15–12:45", "title": "機場簡單墊胃", "desc": "若還沒吃午餐，先買飯糰、三明治或麵包，坐下來吃 15–20 分鐘。船上不把吃飯當成主要安排。", "tag": "補餐", "duration": "20–30 分", "price": "¥500–900", "walk": "", "map": "", "site": "", "review": "", "pic": "", "extra": "", "optional": false}, {"time": "13:15–14:20", "title": "Bay Shuttle 高速船＋神戶接駁", "desc": "關西機場 T1 到 1F 12 號接駁站 → 碼頭 → 13:15 船（13:46 抵達）→ 神戶端免費接駁車至神戶機場。必須提前 20 分鐘抵達集合點；趕不上改 14:45 船。", "tag": "船＋巴士", "duration": "約 65 分", "price": "¥1,880（含 Port Liner）", "walk": "轉乘多段，站內步行", "map": "Kansai Airport Bay Shuttle Terminal", "site": "https://www.kobe-access.jp/eng/time.php", "review": "", "pic": "", "extra": "如果未能在 12:55 前完成船班所需報到及接駁安排，直接採 14:45 船或改搭機場巴士，當天水族館取消。", "optional": false}, {"time": "14:20–15:05", "title": "神戶機場 → 三宮 → 飯店", "desc": "從神戶空港站搭 Port Liner 到三宮站（約 18 分），出站步行去 Daiwa Roynet Hotel Kobe-Sannomiya PREMIER 寄行李。", "tag": "電車", "duration": "約 40 分", "price": "已含組合票", "walk": "從車站到飯店約 8–12 分", "map": "Daiwa Roynet Hotel Kobe-Sannomiya PREMIER", "site": "", "review": "", "pic": "", "extra": "", "optional": false}, {"time": "15:15–16:15", "title": "正式午晚餐：坐下好好吃", "desc": "找三宮附近有座位的定食、拉麵或牛排店。今天午餐會比較晚，因此晚餐可延到 19:30，或將這餐改吃神戶牛午餐（若午餐時段已截止，改一般套餐）。", "tag": "正餐", "duration": "50–60 分", "price": "¥1,200–2,200", "walk": "", "map": "", "site": "", "review": "", "pic": "", "extra": "", "optional": false}, {"time": "16:15–17:00", "title": "飯店休息、喝水", "desc": "不是只有寄行李：進房（若可入住）後坐下或躺一會，補水、換舒適鞋。", "tag": "休息", "duration": "40–45 分", "price": "", "walk": "", "map": "", "site": "", "review": "", "pic": "", "extra": "", "optional": false}, {"time": "17:00–18:20", "title": "átoa 都市型水族館（看體力）", "desc": "官方營業 10:00–19:00、最晚 18:30 入場。從三宮可搭 Port Loop 至「新港町」，不要直接從三宮走 20 分鐘。若搭晚船或累了，今天直接取消，不影響其他日。", "tag": "景點", "duration": "60–80 分", "price": "門票 ¥2,600 起", "walk": "下車後短距離步行", "map": "átoa aquarium Kobe", "site": "https://atoa-kobe.jp/information/", "review": "https://dokodemogo.jp/entry/2022/10/07/104603", "pic": "aquarium", "extra": "", "optional": true}, {"time": "19:00–20:15", "title": "神戶牛 or 神戶燒肉：選一家", "desc": "預算取向：Steakland 神戶牛排套餐約 ¥5,480 起；想吃炭火燒肉則選「石田屋。 本店」（17:00–22:30，週二休）。第一天精神不夠就選一般餐，不要硬撐。", "tag": "晚餐", "duration": "60–75 分", "price": "¥2,000–6,000", "walk": "三宮站周邊", "map": "Steakland Kobe", "site": "https://steakland-kobe.jp/pages/22/", "review": "https://www.howgoodisitactually.com/steakland-kobe/", "pic": "steak", "extra": "真正的「神戶牛」比一般牛排貴。Steakland 午餐的神戶牛與晚餐套餐價不同，點菜前一定看清品項。", "optional": false}]}, {"date": "11/17（二）", "name": "DAY 02", "title": "布引纜車 · 山上下午茶 · Outlet", "sub": "上午山景，下午逛街；每一段安排坐下休息。", "photo": "ropeway", "summar let current=0, mode='days';function nav(){let buttons=D.days.map((d,i)=>`<button class="${mode==='days'&&current===i?'active':''}" onclick="showDay(${i})" aria-label="第${i+1}天"><span class="tabicon">第 ${i+1} 天</span>${d.date.slice(0,5)}</button>`).join('');document.getElementById('topnav').innerHTML=buttons+`<button class="${mode==='more'?'active':''}" onclick="showMore()"><span class="tabicon">餐廳</span>更多</button>`}
function eventCard(e,i){let tags=[e.tag,e.duration,e.price,e.walk&&'步行：'+e.walk].filter(Boolean).map(t=>`<span>${t}</span>`).join('');let btns=[e.map&&`<a class="action" target="_blank" rel="noopener" href="${maps(e.map)}">📍 開 Google 地圖</a>`,e.site&&`<a class="action" target="_blank" rel="noopener" href="${e.site}">🔎 官方資訊</a>`,e.review&&`<a class="action" target="_blank" rel="noopener" href="${e.review}">📖 實際食記／遊記</a>`].filter(Boolean).join('');return `<article class="event" id="evt${i}"><div class="eventhead"><div class="time">${e.time}</div><div class="eventtitle"><h3>${e.title}</h3>${e.optional?'<span class="pill opt">體力允許才去</span>':''}</div></div><p class="desc">${e.desc}</p><div class="meta">${tags}</div>${e.map||e.site||e.review||e.extra||e.pic?`<button class="toggle" onclick="this.closest('.event').classList.toggle('open');this.textContent=this.closest('.event').classList.contains('open')?'收起詳細資訊 ▲':'詳細資訊／導航 ▼'">詳細資訊／導航 ▼</button><div class="details">${e.extra?`<p class="alert">${e.extra}</p>`:''}${e.pic?img(e.pic,'detailPic'):''}<div class="actions">${btns}</div></div>`:''}</article>`}
function showDay(i){mode='days';current=Math.min(4,Math.max(0,i));const d=D.days[current];document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));document.getElementById('dayview').classList.add('active');document.getElementById('dayview').innerHTML=`<div class="dayflag"><div class="bigday">第 ${current+1} 天</div><div class="date">${d.date}</div></div><h2>${d.title}</h2><p class="sub">${d.sub}</p><div class="visual">${img(d.photo)}<div class="phcredit">景點／實際旅遊參考照</div></div><div class="summary"><b>今天走法｜預估餐飲交通景點費 ${d.cost}</b><div>${d.summary}</div></div><p class="note">每天保留三餐與休息；時刻為規劃時間而非訂位或保證車次。點開卡片看地圖、營業資訊和食記。</p><div class="timeline">${d.items.map(eventCard).join('')}</div><div class="panel"><h3>今天的提醒</h3><p>${current===0?'如果搭到 14:45 的船，直接取消水族館；先吃飯與休息。':current===1?'纜車遇強風可能停駛；優先確保 Outlet 購物和正常用餐。':current===2?'神社授與所 16:30 結束，先確認交通時間，別繞去太多地方。':current===3?'大阪城公園很大，只拍近站景色；HARBS 可以坐著吃，grenier 偏外帶。':'11:55 飛機起飛，請保留國際線報到時間。'}</p></div>`;nav();document.getElementById('prev').textContent=current===0?'📍 交通攻略':'← 第 '+current+' 天';document.getElementById('next').textContent=current===4?'🍰 餐廳精選':'第 '+(current+2)+' 天 →';window.scrollTo(0,0)}
function showMore(){mode='more';document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));document.getElementById('foodview').classList.add('active');let cards=[['steak','Steakland 神戶牛','官方神戶牛晚餐套餐 ¥7,480；另有 ¥5,480 神戶牛套餐。想省錢優先看午餐。','Steakland Kobe','https://steakland-kobe.jp/pages/22/','https://www.howgoodisitactually.com/steakland-kobe/'],['steak','石田屋。炭火燒肉','三宮本店 17:00–22:30，週二休（可能臨時休業），主打神戶牛炭火燒肉。','神戸牛 炭焼肉 石田屋。 本店','https://kobe-ishidaya.com/',''],['harbs','HARBS 水果千層','神戶 Crefi 三宮店 11:00–20:00，內用最後點餐 19:00。','HARBS 神戸クレフィ三宮店','https://www.harbs.co.jp/zh-TW/shop_kansai/',''],['grenier','grenier 焦糖千層酥','阪急 Grand Building 1F，偏外帶；甜點頁擇一，不為了打卡連吃三家。','grenier 梅田店','',''],['cafe','にしむら珈琲 早餐','神戶三宮的早餐備選，適合坐下休息。','にしむら珈琲店 三宮店','',''],['aquarium','átoa 水族館','10:00–19:00，18:30 最後入場，官網一般成人 ¥2,600。','átoa aquarium Kobe','https://atoa-kobe.jp/information/','https://dokodemogo.jp/entry/2022/10/07/104603']];document.getElementById('foodview').innerHTML=`<div class="dayflag"><div class="bigday">美食</div><div class="date">姊妹吃什麼</div></div><h2>餐廳、甜點實際參考</h2><p class="sub">先選神戶牛排／燒肉，再挑甜點。照片為實拍參考，價錢與時間以店家當日為準。</p><div class="cardgrid">${cards.map(([k,name,note,q,official,review])=>`<article class="smallcard">${img(k)}<div class="cap">${name}<p class="note">${note}</p></div><div class="actions" style="padding:0 6px 8px"><a class="action" target="_blank" href="${maps(q)}">📍 店家</a>${official?`<a class="action" target="_blank" href="${official}">官網</a>`:''}${review?`<a class="action" target="_blank" href="${review}">食記</a>`:''}</div></article>`).join('')}</div><div class="panel"><h3>Threads 推薦如何參考？</h3><p>你和姊姊的截圖提供了 HARBS、石田屋、L'AVENUE 等候選。截圖不是完整原文網址，因此不會冒充成已驗證的原帖連結。想看網友原文可點下方 Threads 搜尋。</p><div class="actions"><a class="action" target="_blank" href="https://www.threads.com/search?q=%E7%A5%9E%E6%88%B6%E7%89%9B%20%E7%9F%B3%E7%94%B0%E5%B1%8B">Threads：石田屋</a><a class="action" target="_blank" href="https://www.threads.com/search?q=HARBS%20%E7%A5%9E%E6%88%B6">Threads：HARBS</a><a class="action" target="_blank" href="https://www.threads.com/search?q=grenier%20%E6%A2%85%E7%94%B0">Threads：grenier</a></div></div>`;nav();document.getElementById('prev').textContent='🗓️ 五天行程';document.getElementById('next').textContent='💰 預算交通';window.scrollTo(0,0)}
function showBudget(){mode='budget';document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));document.getElementById('budgetview').classList.add('active');const budgets=[['交通含機場往返',2500],['三餐＋甜點',4500],['水族館、纜車、御守',1500],['自己購買大衣、鞋、女裝',10000],['預備金',1500]];document.getElementById('budgetview').innerHTML=`<div class="dayflag"><div class="bigday">預算</div></div><h2>每人 NT$20,000</h2><p class="sub">不含機票與住宿，也不含送同事／老闆／男朋友的伴手禮。</p><div class="panel">${budgets.map(([n,v])=>`<div class="moneyrow"><span>${n}</span><strong>NT$${v.toLocaleString()}</strong></div>`).join('')}<div class="moneyrow"><b>每人總上限</b><strong>NT$20,000</strong></div></div><div class="panel"><h3>花費手動記帳</h3><p class="note">數字只存在這個頁面的暫時狀態，重新開啟會重設。日幣換算暫用 0.21 台幣／日幣。</p><label>今日新增日幣支出 <input id="spent" type="number" inputmode="numeric" min="0" placeholder="例如 1800" style="font-size:20px;width:100%;padding:12px;border-radius:10px;border:1px solid #aaa"></label><button class="toggle" onclick="addExpense()">加入紀錄</button><div id="expenseSum" class="budgetBox">目前記錄 ¥0</div></div><div class="panel"><h3>伴手禮另計</h3><p>10 位同事：考慮大阪花餅乾、月化粧的獨立包裝；老闆：Baton d’or 禮盒；男朋友：另挑喜歡的男裝小配件＋零食。建議先另留 NT$2,000–4,000。</p></div>`;nav();document.getElementById('prev').textContent='🗓️ 五天行程';document.getElementById('next').textContent='🚢 機場交通';window.scrollTo(0,0)}
let expense=0;function addExpense(){let v=Math.max(0,Number(document.getElementById('spent').value)||0);expense+=v;document.getElementById('expenseSum').textContent=`目前 ¥${expense.toLocaleString()} ≈ NT$${Math.round(expense*.21).toLocaleString()}`;document.getElementById('spent').value=''}
function showTransport(){mode='transport';document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));document.getElementById('transportview').classList.add('active');document.getElementById('transportview').innerHTML=`<div class="dayflag"><div class="bigday">交通</div></div><h2>機場往返完整走法</h2><div class="panel"><h3>11/16 關西機場 → 神戶飯店</h3><p>① 出關 T1 → Bay Shuttle 售票櫃檯（買 ¥1,880 含 Port Liner 組合票）</p><p>② T1 1F 12 號站搭免費接駁車 → 關西機場船碼頭</p><p>③ 13:15 船出發、13:46 抵達神戶碼頭。船公司要求至少提前 20 分鐘到集合位置。若太趕，改 14:45 出發，15:16 抵達。</p><p>④ 神戶碼頭搭免費接駁車 → 神戶機場 T1</p><p>⑤ Port Liner 神戶空港站 → 三宮站（約 18 分）</p><p>⑥ 三宮出站 → 飯店步行約 8–12 分；有大行李要多留時間。</p><div class="actions"><a class="action" href="https://www.kobe-access.jp/eng/time.php" target="_blank">🚢 官方船班表</a><a class="action" href="https://www.kobe-access.jp/eng/howto.php" target="_blank">乘船教學</a><a class="action" href="https://www.kate.co.jp/en/timetable/detail/KB" target="_blank">停船備案：機場巴士</a></div><p class="alert">若尚未吃飯，先在機場購買簡單午餐；搭船轉車後進飯店休息，水族館可以取消。不要為了景點犧牲吃飯。</p></div><div class="panel"><h3>11/20 大阪飯店 → 關西機場</h3><p>① 飯店早餐（便利商店簡單吃）→ 07:05–07:20 退房並走到 JR 大阪站「うめきた地下ホーム」</p><p>② 搭 HARUKA 直達關西機場，約 50–60 分鐘。車次必須前一晚再核對。</p><p>③ 目標 09:00 前到機場，保留長榮航空國際線報到時間；BR181 11:55 起飛。</p><p>④ JR 官方 WEST QR HARUKA 2026/11/1 起大阪／新大阪—關西機場，符合資格的一般成人單程 ¥1,900。</p><div class="actions"><a class="action" href="https://www.westjr.co.jp/global/en/ticket/westqr/haruka/" target="_blank">🚆 官方優惠車票</a><a class="action" href="https://global.trafficinfo.westjr.co.jp/tc/express/" target="_blank">列車運行狀況</a></div></div>`;nav();document.getElementById('prev').textContent='🗓️ 五天行程';document.getElementById('next').textContent='🍰 餐廳精選';window.scrollTo(0,0)}
function next(){if(mode==='days'){current<4?showDay(current+1):showMore()}else if(mode==='more')showBudget();else if(mode==='budget')showTransport();else showMore()}
function prev(){if(mode==='days'){current>0?showDay(current-1):showTransport()}else showDay(0)}document.getElementById('prev').addEventListener('click',prev);document.getElementById('next').addEventListener('click',next);document.getElementById('heroImage').src=photo('ropeway');document.getElementById('heroImage').onerror=()=>{document.getElementById('heroImage').src=fallback('ropeway')};showDay(0);
</script></body></html>
